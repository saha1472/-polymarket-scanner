name: Polymarket scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always start from the latest ledger, even if this run waited in the queue
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Arbitrage scanner
        run: python scanner.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Smart-money signals
        run: python signals.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update paper ledger"
          if ! git push; then
            echo "::warning::ledger.json changed on GitHub during this run (probably a manual edit). This run's ledger was not saved; the next run starts from the latest one."
          fi
