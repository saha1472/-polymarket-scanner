name: Polymarket scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # trader re-scoring (every 6h) takes ~15 min for all scans
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always start from the latest ledgers, even if this run waited in the queue
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests

      # Event -> category lookups. Kept in the Actions cache, not the repo.
      - uses: actions/cache@v4
        with:
          path: tags.json
          key: tags-${{ github.run_id }}
          restore-keys: tags-

      - name: Arbitrage scanner
        run: python scanner.py

      # All five scans run side by side (separate ledgers), then their logs
      # are printed one after another. The step fails if any scan failed.
      - name: Smart-money signals (general + categories) + weather desk
        if: ${{ !cancelled() }}
        run: |
          for scan in GENERAL SPORTS ESPORTS TECH WEATHER; do
            arg=$scan; [ "$scan" = GENERAL ] && arg=""
            python signals.py $arg > "log_$scan.txt" 2>&1 &
            echo "$! $scan" >> pids.txt
          done
          python weather.py > log_WXDESK.txt 2>&1 &
          echo "$! WXDESK" >> pids.txt
          fail=0
          while read pid scan; do
            if ! wait "$pid"; then echo "::error::$scan scan failed"; fail=1; fi
          done < pids.txt
          for scan in GENERAL SPORTS ESPORTS TECH WEATHER WXDESK; do
            echo "::group::$scan"; cat "log_$scan.txt"; echo "::endgroup::"
          done
          exit $fail

      - name: Daily heartbeat
        if: ${{ !cancelled() }}
        run: python heartbeat.py

      - name: Save ledgers
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger*.json traders_*.json $(ls wx_state.json heartbeat.json 2>/dev/null)
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update paper ledgers"
          if ! git push; then
            echo "::warning::Files changed on GitHub during this run (probably a manual edit). This run's ledgers were not saved; the next run starts from the latest ones."
          fi
