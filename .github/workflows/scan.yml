name: Polymarket scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Measured over the last 70 runs: the whole job takes 11 min (longest 16), so 30 is generous.
    # Every step below also has its own limit, at least twice its longest run. They are small enough that
    # any two steps can hang at their limit and the save step still has time: a hung step then fails
    # alone instead of eating the job and skipping the save.
    timeout-minutes: 30
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      # when this run started: the book watcher stops in time for the next run
      - run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          # the branch this run was started on (main for the schedule); always its
          # latest commit, even if the run waited in the queue
          ref: ${{ github.ref_name }}
          fetch-depth: 50   # enough history to work out what changed if a save is rejected
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Event -> category lookups. Kept in the Actions cache, not the repo.
      - uses: actions/cache@v4
        with:
          path: tags.json
          key: tags-${{ github.run_id }}
          restore-keys: tags-

      # GATE: if any test fails, nothing below trades, notifies or saves.
      - name: Simulator self-tests
        id: tests
        timeout-minutes: 5    # takes ~3 s
        run: python -m unittest discover -s tests -v

      - name: Arbitrage scanner
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5    # longest seen: 2 min
        run: python scanner.py

      # All five scans run side by side (separate ledgers), then their logs
      # are printed one after another. The step fails if any scan failed.
      - name: Smart-money signals (general + categories) + weather desk
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 8    # longest seen: 3 min
        run: |
          for scan in GENERAL SPORTS ESPORTS TECH WEATHER GEOPOLITICS; do
            arg=$scan; [ "$scan" = GENERAL ] && arg=""
            python signals.py $arg > "log_$scan.txt" 2>&1 &
            echo "$! $scan" >> pids.txt
          done
          python weather.py > log_WXDESK.txt 2>&1 &
          echo "$! WXDESK" >> pids.txt
          fail=0
          while read pid scan; do
            if ! wait "$pid"; then echo "::error::$scan scan failed"; fail=1; fi
          done < pids.txt
          for scan in GENERAL SPORTS ESPORTS TECH WEATHER GEOPOLITICS WXDESK; do
            echo "::group::$scan"; cat "log_$scan.txt"; echo "::endgroup::"
          done
          exit $fail

      # SHADOW experiment (never trades): log ensemble-model probabilities for
      # weather buckets next to market prices. Allowed to fail without failing the run.
      - name: Weather ensemble shadow log
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3    # longest seen: 6 s
        run: python wx_ensemble.py

      # SHADOW experiment (never trades): once a day, check on settled results whether
      # blending the ensemble model with the market price beats the market on days it
      # was not fitted on. Fails closed: untrusted means "just use the market price".
      - name: Weather calibration (shadow)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6    # a hung data API must never eat the run and skip the save step
        run: python wx_calibrate.py

      # SHADOW experiment (never trades): politics plays where 3+ tracked traders
      # hold the same side. Runs after the scans have finished (it shares tags.json
      # with them). Allowed to fail without failing the run.
      - name: Politics consensus shadow
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5    # longest seen: 2 min
        run: python shadow_politics.py

      # For the rest of this run's 15-minute slot, watch the shadow limit bids and the
      # rewards tracker's quotes about every 30 seconds (it ends itself 11 minutes after
      # the run started).
      - name: Book watcher
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 12   # takes ~9.5 min by design
        run: python watch_books.py

      # Hypothetical market-making record for the rewards question. Never trades.
      - name: Rewards tracker
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3    # takes ~1 s
        run: python rewards_tracker.py

      - name: Daily heartbeat
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 2    # takes ~1 s
        run: python heartbeat.py

      # READ-ONLY: every paper strategy's return per bet, its likely range and whether
      # anything is proven yet. Shown on this run's summary page. Never trades or saves.
      - name: Scorecard
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2    # takes ~1 s
        run: python scorecard.py --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Save ledgers
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 6    # longest seen: 5 min (push retries)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger*.json traders_*.json $(ls wx_state.json heartbeat.json wx_shadow*.jsonl wx_calibration.json wx_winners.json shadow_*.json rewards_state.json rewards_log*.jsonl 2>/dev/null)
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update paper ledgers"
          # A push can fail because files changed on GitHub during the run, or
          # because of a network / authentication problem. Try a few times.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push attempt $attempt failed; checking why..."
            if ! git fetch --depth=50 origin "$GITHUB_REF_NAME"; then
              echo "Can't reach GitHub (network or auth); retrying in $((attempt * 15))s"
              sleep $((attempt * 15)); continue
            fi
            base=$(git merge-base HEAD "origin/$GITHUB_REF_NAME")
            if git diff --name-only "$base" "origin/$GITHUB_REF_NAME" | grep -qE '^((ledger.*|traders_.*|wx_state|wx_calibration|wx_winners|heartbeat|shadow_.*|rewards_state)\.json|(wx_shadow|rewards_log)(_[0-9]{4}-[0-9]{2})?\.jsonl)$'; then
              echo "::error::State files changed on GitHub during this run. This run's ledgers were NOT saved (copy kept as a run artifact)."
              exit 1
            fi
            # only code/other files changed (e.g. a pasted update): replay our save on top
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; break; }
            sleep $((attempt * 5))
          done
          echo "::error::Could not save ledgers (network, auth or conflict). Copy kept as a run artifact."
          exit 1

      # A timeout counts as "cancelled", not "failed": keep the ledgers and warn then too.
      - name: Keep this run's ledgers if saving failed
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-ledgers-${{ github.run_id }}
          path: |
            ledger*.json
            traders_*.json
            wx_state.json
            wx_calibration.json
            wx_winners.json
            heartbeat.json
            wx_shadow*.jsonl
            shadow_*.json
            rewards_state.json
            rewards_log*.jsonl
          if-no-files-found: ignore

      - name: Warn on Discord if anything failed
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          curl -s -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" \
            -d "{\"content\": \"⚠️ A bot run failed (tests, a scan, or saving). If tests failed, nothing was traded or saved. Otherwise alerts from this run may not be in the saved ledgers. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
