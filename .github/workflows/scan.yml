name: Polymarket scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # trader re-scoring (every 6h) takes ~15 min for all scans
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the branch this run was started on (main for the schedule); always its
          # latest commit, even if the run waited in the queue
          ref: ${{ github.ref_name }}
          fetch-depth: 50   # enough history to work out what changed if a save is rejected
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests

      # Event -> category lookups. Kept in the Actions cache, not the repo.
      - uses: actions/cache@v4
        with:
          path: tags.json
          key: tags-${{ github.run_id }}
          restore-keys: tags-

      # GATE: if any test fails, nothing below trades, notifies or saves.
      - name: Simulator self-tests
        id: tests
        run: python -m unittest discover -s tests -v

      - name: Arbitrage scanner
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python scanner.py

      # All five scans run side by side (separate ledgers), then their logs
      # are printed one after another. The step fails if any scan failed.
      - name: Smart-money signals (general + categories) + weather desk
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          for scan in GENERAL SPORTS ESPORTS TECH WEATHER; do
            arg=$scan; [ "$scan" = GENERAL ] && arg=""
            python signals.py $arg > "log_$scan.txt" 2>&1 &
            echo "$! $scan" >> pids.txt
          done
          python weather.py > log_WXDESK.txt 2>&1 &
          echo "$! WXDESK" >> pids.txt
          fail=0
          while read pid scan; do
            if ! wait "$pid"; then echo "::error::$scan scan failed"; fail=1; fi
          done < pids.txt
          for scan in GENERAL SPORTS ESPORTS TECH WEATHER WXDESK; do
            echo "::group::$scan"; cat "log_$scan.txt"; echo "::endgroup::"
          done
          exit $fail

      # SHADOW experiment (never trades): log ensemble-model probabilities for
      # weather buckets next to market prices. Allowed to fail without failing the run.
      - name: Weather ensemble shadow log
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        run: python wx_ensemble.py

      - name: Daily heartbeat
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python heartbeat.py

      - name: Save ledgers
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger*.json traders_*.json $(ls wx_state.json heartbeat.json wx_shadow.jsonl 2>/dev/null)
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update paper ledgers"
          # A push can fail because files changed on GitHub during the run, or
          # because of a network / authentication problem. Try a few times.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push attempt $attempt failed; checking why..."
            if ! git fetch --depth=50 origin "$GITHUB_REF_NAME"; then
              echo "Can't reach GitHub (network or auth); retrying in $((attempt * 15))s"
              sleep $((attempt * 15)); continue
            fi
            base=$(git merge-base HEAD "origin/$GITHUB_REF_NAME")
            if git diff --name-only "$base" "origin/$GITHUB_REF_NAME" | grep -qE '^((ledger.*|traders_.*|wx_state|heartbeat)\.json|wx_shadow\.jsonl)$'; then
              echo "::error::State files changed on GitHub during this run. This run's ledgers were NOT saved (copy kept as a run artifact)."
              exit 1
            fi
            # only code/other files changed (e.g. a pasted update): replay our save on top
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; break; }
            sleep $((attempt * 5))
          done
          echo "::error::Could not save ledgers (network, auth or conflict). Copy kept as a run artifact."
          exit 1

      - name: Keep this run's ledgers if saving failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-ledgers-${{ github.run_id }}
          path: |
            ledger*.json
            traders_*.json
            wx_state.json
            heartbeat.json
            wx_shadow.jsonl
          if-no-files-found: ignore

      - name: Warn on Discord if anything failed
        if: ${{ failure() }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          curl -s -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" \
            -d "{\"content\": \"⚠️ A bot run failed (tests, a scan, or saving). If tests failed, nothing was traded or saved. Otherwise alerts from this run may not be in the saved ledgers. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
